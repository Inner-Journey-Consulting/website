<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cybersecurity Awareness Training</title>
  <script>
    // Served from a folder (innerjourneymke.com/training/), so its relative paths
    // (css/, js/, content/) only resolve correctly with the trailing slash.
    // Without it, the browser looks for them at the site root and gets the
    // website's files instead. Add the slash before anything else loads.
    if (/\/training$/.test(location.pathname))
      location.replace(location.pathname + "/" + location.search + location.hash);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/course.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#course">Skip to content</a>

  <header>
    <nav class="navbar navbar-expand-lg navbar-woods" aria-label="Course">
      <div class="container">
        <a class="navbar-brand" href="#/" id="brand-title">Cybersecurity Awareness Training</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#courseNav"
                aria-controls="courseNav" aria-expanded="false" aria-label="Show modules">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="courseNav">
          <ul class="navbar-nav ms-auto" id="module-nav"></ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container" id="course" tabindex="-1">
    <noscript><p>This course needs JavaScript turned on.</p></noscript>
  </main>

  <footer class="site-foot">
    <div class="container">Questions or something to report? Contact <span id="footer-contact"></span>.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Settings, then one file per module, then the engine. -->
  <script src="js/config.js"></script>
  <script src="content/01-phishing.js"></script>
  <script src="content/02-passwords.js"></script>
  <script src="content/03-data.js"></script>
  <script src="content/04-reporting.js"></script>
  <script src="js/course.js"></script>
</body>
</html>
